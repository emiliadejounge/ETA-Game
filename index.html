<!doctype html>
<html lang="en">
<head>

<title>Searcher: Buy a Business</title>
<meta name="description" content="A choose-your-path game about buying a small business. MGT 4455 Entrepreneurship Through Acquisition.">

<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f2f4f1; --ink:#14171a; --muted:#5d636a; --line:#e2e5e1;
  --accent:#1f8a57; --accent-ink:#ffffff; --accent-soft:#e2f3e9;
  --gold:#a86d12; --good:#1d7a45; --good-soft:#e2f3e9; --ok:#8a6100; --ok-soft:#fbf0d6; --bad:#b3261e; --bad-soft:#fbe3e1;
  --shadow:0 1px 2px rgba(20,30,20,.06),0 8px 24px rgba(20,30,20,.08);
  --stage-sky:linear-gradient(to bottom,#e6f3fb 0%,#f3f9f5 75%);
  --stage-floor:#cfe6d6;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Calibri,Carlito,"Segoe UI",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Pixelify Sans",monospace;font-weight:700;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}

/* Title screen */
.title-screen{text-align:center;min-height:calc(100vh - 80px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.course{display:inline-block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface)}
.title-screen h1{font-size:clamp(44px,9vw,84px);font-weight:800;margin:22px 0 10px;letter-spacing:.01em}
.title-screen h1 span{color:var(--accent)}
.hero-sprite{height:min(300px,38vh);margin:0 0 24px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.12));animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.avatar{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:-6px;margin-right:8px;background:var(--surface-2) url(img/searcher.png) no-repeat 50% 4%/280%;border:1px solid var(--accent)}
.scene-stage{position:relative;height:240px;margin:-26px -26px 20px;border-radius:18px 18px 0 0;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12%;
  background:linear-gradient(to top,var(--stage-floor) 0,var(--stage-floor) 22px,transparent 22px),var(--stage-sky);border-bottom:1px solid var(--line)}
.scene-stage .sprite{height:220px;margin-bottom:6px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18));animation:bob 2.8s ease-in-out infinite}
.scene-stage .sprite.right{animation-delay:-1.4s}
.scene-stage .prop{font-size:96px;line-height:1;margin-bottom:34px;animation:bob 3s ease-in-out infinite;animation-delay:-1s}
.howto{margin-top:12px}
.howgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.howgrid>div,.howmeters>div{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--muted)}
.howgrid b,.howmeters b{display:block;color:var(--ink);margin-bottom:2px;font-size:16px}
.howgrid .verdict{margin:2px 2px 0 0;font-size:11px;padding:2px 8px}
.howmeters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.howh{font-size:21px;margin:20px 0 10px}
kbd{font-family:inherit;font-size:13px;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px}

.biz{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);height:200px;z-index:0;opacity:.95}
.biz img{height:100%;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
.biz .sign{position:absolute;left:47%;bottom:19%;transform:translateX(-50%);font-family:"Pixelify Sans",monospace;font-weight:700;font-size:13px;letter-spacing:.04em;white-space:nowrap;background:#c62828;color:#fff;padding:2px 7px;border-radius:4px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.scene-stage .sprite,.scene-stage .prop{position:relative;z-index:1}
.scene-stage.has-biz .nametag{top:8px;z-index:2}
@media (max-width:620px){.biz{height:112px}.biz .sign{font-size:8px;padding:1px 4px}}
.nametag{box-shadow:0 2px 6px rgba(0,0,0,.12);position:absolute;left:50%;transform:translateX(-50%);top:14px;white-space:nowrap;font-family:"Pixelify Sans",monospace;font-size:14px;background:#f4c04e;color:#000;padding:3px 10px;border-radius:6px}
@media (max-width:620px){.scene-stage{height:190px;margin:-20px -16px 16px;padding:0 8%}.scene-stage .sprite{height:172px}.scene-stage .prop{font-size:72px;margin-bottom:26px}}
.tagline{font-size:clamp(17px,2.6vw,21px);color:var(--muted);max-width:560px;margin:0 auto 26px}
.hero-art{font-size:56px;margin:8px 0 18px;letter-spacing:10px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:660px;margin:0 auto 30px;text-align:left}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;color:var(--muted)}
.how b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.credits{margin-top:34px;font-size:14px;color:var(--muted)}
.credits b{color:var(--ink);font-weight:600}
@media (max-width:620px){.how{grid-template-columns:1fr}}

.btn{font-family:"Pixelify Sans",monospace;letter-spacing:.02em;border:0;border-radius:12px;padding:14px 26px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);transition:transform .12s ease,filter .12s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:focus-visible,.choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:9px 16px;font-size:14px}

/* HUD */
.hud{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:12px 0 10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.stages{display:flex;gap:4px;margin-bottom:10px}
.stages i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stages i.done{background:var(--accent)}
.stages i.now{background:var(--gold)}
.stage-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;margin-bottom:8px}
.meters{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0}
.meter .k{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .v{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .5s ease}
.meter.flash{animation:flash .7s ease}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@media (max-width:620px){.meters{grid-template-columns:repeat(3,1fr)}.meter:nth-child(n+4){grid-column:span 1}}

/* Scene */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow);animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.art{font-size:44px;line-height:1;margin-bottom:12px}
.card h2{font-size:clamp(25px,4.2vw,32px);margin-bottom:10px}
.story{font-size:17px;margin:0 0 6px}
.story p{margin:0 0 10px}
.ask{font-weight:600;margin:16px 0 12px}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;transition:border-color .12s,transform .12s}
.choice:hover{border-color:var(--accent);transform:translateX(2px)}
.choice .key{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;display:grid;place-items:center;color:var(--muted)}
.choice .lbl{font-weight:500}
.choice .sub{display:block;font-size:14px;color:var(--muted);font-weight:400;margin-top:2px}

/* Feedback */
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:5px 12px;margin-bottom:12px}
.verdict.best{background:var(--good-soft);color:var(--good)}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.you-chose{font-size:14px;color:var(--muted);margin-bottom:6px}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.delta{font-size:13px;font-weight:600;border-radius:8px;padding:4px 9px;background:var(--surface-2)}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.lesson{margin-top:16px;border-left:4px solid var(--gold);background:var(--surface-2);border-radius:0 12px 12px 0;padding:12px 16px}
.lesson .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.lesson + .lesson{margin-top:8px}
.next-row{display:flex;justify-content:flex-end;margin-top:20px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px}

/* Results */
.result-hero{text-align:center;padding:10px 0 4px}
.result-hero .big{font-size:64px}
.result-hero h2{font-size:clamp(30px,6vw,44px);margin:6px 0}
.payout{font-family:"Pixelify Sans",monospace;font-size:clamp(40px,8vw,60px);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.math{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px;font-variant-numeric:tabular-nums}
.math td{padding:8px 4px;border-bottom:1px solid var(--line)}
.math td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.math tr.total td{border-bottom:0;font-weight:800;font-size:17px;color:var(--accent)}
.math .note{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.scoregrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.scoregrid > div{background:var(--surface-2);border-radius:12px;padding:12px;text-align:center}
.scoregrid .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.scoregrid .l{font-size:12px;color:var(--muted)}
.scoregrid .total{background:var(--accent);color:var(--accent-ink)}
.scoregrid .total .l{color:var(--accent-ink);opacity:.85}
@media (max-width:620px){.scoregrid{grid-template-columns:repeat(2,1fr)}.scoregrid .total{grid-column:span 2}}
.section{margin-top:22px}
.section h3{font-size:22px;margin-bottom:10px}
.submit-row{display:flex;gap:8px;flex-wrap:wrap}
.submit-row input{flex:1;min-width:180px;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.lb{width:100%;border-collapse:collapse;font-size:15px}
.lb th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.lb td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lb td.num,.lb th.num{text-align:right}
.lb tr.me td{background:var(--accent-soft);font-weight:700}
.lb .end{font-size:13px;color:var(--muted)}
.lb-note{font-size:12.5px;color:var(--muted);margin-top:8px}
details.reading{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:var(--surface-2)}
details.reading summary{cursor:pointer;font-weight:600}
details.reading ul{margin:8px 0 2px;padding-left:20px}
details.reading li{margin-bottom:6px;font-size:15px}
ul.tk{list-style:none;padding-left:0!important}
ul.tk li{display:flex;gap:10px}
ul.tk li span{flex:none;width:18px;color:var(--good);font-weight:700}
ul.tk li.miss{color:var(--muted);opacity:.6}
ul.tk li.miss span{color:var(--muted)}
.new{display:inline-block;background:var(--gold);color:#000;border-radius:4px;padding:0 5px;font-size:10px;letter-spacing:.06em;margin-left:4px;vertical-align:1px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
footer{text-align:center;font-size:12.5px;color:var(--muted);margin-top:30px}
@media (max-width:620px){.card{padding:20px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ---------- Readings & takeaways ----------
const R = {
  OPT: "What Are You Optimizing in Your Post-MBA Career?",
  PAY: "Which MBAs Make More: Consultants or Small-Business Owners?",
  TWO: "Full-Time 2-Year ETA Path",
  F10: "First 10 Questions for Would-be Searchers",
  STR: "Exploring Various Search Fund Structures",
  TER: "Mastery of Self-Funded Investment Terms",
  HBR: "HBR Guide to Buying a Small Business",
  BTB: "Buy Then Build",
  PRI: "2021 Search Fund Primer",
  LBO: "An Introduction to Leveraged Buyouts (Video)",
  VIT: "Vitamina: Childcare in Chile Case Study",
  SCO: "Scott Turbon Mixer: Small Business Innovation"
};
const T = {
  BTB:[
    "Ownership drives outsized success in life. Being an owner is correlated with being extremely wealthy, and ETA returns can be outsized compared to typical investment paths.",
    "When identifying a target, SDE and the opportunity you want to target matter more than the industry, unless you're using a platform strategy.",
    "After the LOI is signed, use due diligence to learn as much as possible about the business while risking only your escrow and professional fees. Dive deep and consult your network to truly know what you're buying.",
    "In the transition, leverage the seller's expertise but get them out as soon as possible. Make a good first impression with employees, integrate quickly to understand their work, and become their point of contact.",
    "To get the best deal flow, get upstream: work with brokers, get vetted, and be clear about your interests."],
  HBR:[
    "The ideal company is enduringly profitable, established, growing slowly, and has recurring, loyal customers. That lowers the risk of a big drop in cash flow and still leaves room to grow.",
    "Treat sourcing as a repetitive task that continues until the deal is complete. If you stop when you get excited about a deal, restarting can take a month or two.",
    "Even without exact numbers on how recurring revenue is, you can infer it from the product's reputation, competition, and customer type.",
    "Don't bid your highest possible price at the start. A fair price and terms leave room for adjustment and align your relationship with the seller.",
    "Find out why the seller is selling. It shows whether the deal will get across the line and whether there are skeletons in the closet."],
  TWO:[
    "Entering a career in ETA doesn't take years and years of background to have the right experience.",
    "Gaining initial knowledge by attending conferences and taking classes can set you up for opportunities.",
    "Academic activity is a small part of the work it takes to prepare yourself for the role.",
    "School offers lots of resources to take advantage of: networking, club roles, and info sessions.",
    "Complete other roles in operations or finance to fill in skills you can apply later."],
  LBO:[
    "A leveraged buyout is when you borrow money to buy a company.",
    "When you buy a house, the down payment is your equity and the rest is debt in the form of a mortgage.",
    "An LBO is the same concept: a combination of equity and debt from a lender.",
    "The end goal is to sell the asset for more than you paid and pay back the debt, earning a large return on your equity.",
    "Improving the company's operations can increase the price of the asset and your return."],
  OPT:[
    "MBAs choose careers for logical reasons, but those reasons send the majority of students into consulting and finance.",
    "Building long-term wealth is hard if you only focus on saving income. Growing your balance sheet works best through some form of ownership.",
    "Tier-two cities are more reasonably priced and more flexible, and they still have great employment opportunities.",
    "People often optimize for their professional life and forget to focus on their partners, children, and personal lives.",
    "When considering a post-graduate role, don't just think about the next 2–3 years. Think about what you want your life to look like at 40–50."],
  F10:[
    "The median life cycle of a search fund is over eight years, and it demands a large commitment for most of that time.",
    "For many would-be entrepreneurs, coming up with the business idea is the major hurdle. ETA removes it by shifting the focus to evaluating existing businesses and their potential for growth.",
    "Investors like search funds because they typically outperform many other alternative investments (over 30% IRR), let investors choose when to participate, and reduce risk through a long-term relationship with the entrepreneur.",
    "Choose your target geography and industry based on where you're most likely to succeed: your connections, demand, and where you can add value.",
    "If strong returns aren't achieved or no acquisition happens, the searcher bears a significant opportunity cost from the discounted salary and the time invested."],
  PAY:[
    "Compensation is more than money. It also includes how much you enjoy your career, the fulfillment it provides, and the influence you have.",
    "Small-business owners can set their own hours, make their own management decisions, and take pride in owning their work.",
    "Traditional careers such as consulting, investment banking, and private equity involve a lot of angst and lack of control.",
    "Using average salary growth in traditional careers and conservative small-business metrics, the present value of pay on the two paths is reasonably similar.",
    "Choose the ETA path because you'd thrive in that environment, not because of the money."],
  PRI:[
    "Since the 2020s, cold emails have become less effective for reaching sellers. Creating a differentiated connection is increasingly important.",
    "Choosing an industry with a tailwind allows natural sales growth without intense competition.",
    "Not acquiring a company leaves a searcher with new skills for their next career, while a bad investment leaves a tainted mark on their reputation.",
    "Brokered deals are a significant source of qualified deal flow because the company is actively looking for a buyer. But brokers push for the highest price and often show deals to PE firms first, so searchers get deals others have passed on.",
    "Mishandled due diligence can break down the relationship with the seller and hurt company performance. Share what you're trying to learn and work with the materials and knowledge the seller already has."],
  TER:[
    "Preferred return is what investors ask for, typically 10%, accruing annually.",
    "Return of capital caps the searcher's salary, since everyone wants money made through profit distributions. Distributions go first to investors' preferred return, then to returning their invested capital, and the rest is split between the searcher and investors.",
    "Step-up: investor ownership equals the percentage of the purchase price investors contributed, multiplied by the step-up.",
    "Investor protections are decisions that need investor approval, like raising the searcher's salary, buying a business, or selling it.",
    "These terms have become fairly standardized across the industry, so know what investors will expect you to offer."],
  STR:[
    "Traditional search fund: the searcher is paid during a 2–3 year search, then rewarded with equity at acquisition. It allows larger deals, a network of advisors and investors, and a focus on high-growth businesses.",
    "Self-funded search: the searcher uses their own capital and keeps much more equity at acquisition. It's the riskiest model because there's the least support.",
    "Accelerator model: an accelerator sponsors the searcher, trains them, provides equity for the acquisition, and advises the business afterward.",
    "Holding company model: the entrepreneur buys multiple businesses under one umbrella and usually operates them for longer.",
    "Single-sponsor model: all capital comes from one source, which simplifies the investment and gives more flexibility on approach and timing."],
  VIT:[
    "Local laws can make an opportunity more or less viable than elsewhere. Childcare is usually a hard industry, but Chile's employment laws create a large, attractive B2B segment.",
    "Different industries need different metrics. Starbucks has 150% annual turnover because training is minimal, but quality-driven child education needs turnover far lower (12%).",
    "Using data to manage employee performance, such as camera streams and audits, improves execution and lets you compare locations.",
    "Know what turns customers off in your industry and design systems, like a career ladder, to overcome it. That becomes your competitive advantage.",
    "Clear values shape your value proposition, create synergies across the business, and give you a clear direction for improvement."],
  SCO:[
    "Intellectual property can give you a head start, but it isn't enough for a long-term advantage.",
    "Highly specific, custom work can't be standardized, so it requires a highly skilled workforce.",
    "Incentives like job security and competitive salaries help keep talent over time, even in a remote area.",
    "Aligning your target customer with your operations strengthens the value proposition, for example by never cutting corners and using the best materials for the most demanding customers.",
    "When employees like salespeople and engineers interact, information flows naturally about which products to sell, which features to develop, and how to build the best products."]
};
const ALL_KEYS = Object.keys(T).flatMap(k=>T[k].map((_,i)=>`${k}.${i+1}`));
const tk = key => { const [r,n]=key.split("."); return {key, src:R[r], text:T[r][+n-1]}; };
const STAGES = ["The Crossroads","Fund the Search","Build a Thesis","Sourcing","Meet the Seller","The LOI","Due Diligence","Day 1 as CEO","The Exit"];

// ---------- Characters ----------
// img: transparent PNG in img/. Characters without an image show their emoji.
const CHARS = {
  searcher:{name:"You",img:"img/searcher.png"},
  roommate:{name:"Your Roommate",img:"img/roommate.png"},
  mentor:{name:"Prof. Whitaker · Your Mentor",img:"img/mentor.png"},
  partner:{name:"Your Partner",img:"img/partner.png"},
  priya:{name:"Priya · Lead Investor",img:"img/investor.png"},
  broker:{name:"The Broker",img:"img/broker.png"},
  gary:{name:"Gary Pruitt · Seller",img:"img/gary.png"},
  team:{name:"Dale · Lead Technician",img:"img/technician.png"}
};
const WHO = {optimize:"mentor",ready:"mentor",school:"mentor",summer:"mentor",doubt:"mentor",why:"roommate",where:"partner",terms:"priya",waterfall:"priya",raise:"priya",profile:"broker",thesis:"priya",tailwind:"priya",moat:"priya",sourcing:"broker",found:"broker",gary:"gary",recurring:"gary",loi:"gary",fallout:"gary",dd:"gary","gary-role":"gary",day1:"team",turnover:"team",growth:"team"};
function sprite(key,cls=""){
  const c=CHARS[key];
  return c.img?`<img class="sprite ${cls}" src="${c.img}" alt="${c.name}">`:`<div class="prop ${cls}" aria-hidden="true">${c.emoji}</div>`;
}
const PLACE = {found:true,"gary-role":true,day1:true};
const BUILDING = `<div class="biz" aria-label="Bugs B. Gone headquarters"><img src="img/business.png" alt=""><span class="sign">BUGS B. GONE</span></div>`;
function stageArt(sc,propOverride,place){
  const who=sc&&WHO[sc.id];
  place=place||(sc&&PLACE[sc.id]);
  const right=who?sprite(who,"right"):`<div class="prop right" aria-hidden="true">${propOverride||sc.art}</div>`;

// ---------- Scene flow ----------
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function next(i){
  while(i<SCENES.length && SCENES[i].when && !SCENES[i].when(S)) i++;
  if(i>=SCENES.length) return results();
  S.scene=i;
  const sc=SCENES[i];
  if(sc.enter) sc.enter(S);
  app.innerHTML=hud(sc.stage)+`
  <div class="card">
    ${stageArt(sc)}
    <h2>${sc.title}</h2>
    <div class="story">${val(sc.text)}</div>
    <div class="ask">${sc.ask}</div>
    <div class="choices">${shuffled(sc.choices.map((c,j)=>[c,j])).map(([c,j],pos)=>`<button class="choice" data-j="${j}" data-pos="${pos}"><span class="key">${pos+1}</span><span class="lbl">${c.t}${c.sub?`<span class="sub">${c.sub}</span>`:""}</span></button>`).join("")}</div>
  </div>
  <p class="hint">Tip: press 1–${sc.choices.length} to choose</p>`;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(i,+b.dataset.j));
  window.scrollTo({top:0,behavior:"smooth"});
}

function choose(i,j){
  const sc=SCENES[i], c=sc.choices[j];
  const before={cash:S.cash,trust:S.trust,inv:S.inv,life:S.life,months:S.months};
  for(const [k,v] of Object.entries(c.fx||{})) S[k]+=v;
  if(c.set) c.set(S);
  S.trust=clamp(S.trust,0,100);S.inv=clamp(S.inv,0,100);S.life=clamp(S.life,0,100);S.cash=Math.max(0,S.cash);
  if(c.tag==="best") S.best++;
  if(sc.choices.length>1) S.total++;
  const tkBefore=S.lessons.length;
  const shown=[...new Set([...(c.L||[]),...(sc.L||[])])];
  const fresh_=new Set(shown.filter(k=>!S.lessons.includes(k)));
  [...shown,...(sc.cover||[])].forEach(k=>{ if(!S.lessons.includes(k)) S.lessons.push(k); });
  const tkGain=S.lessons.length-tkBefore;
  const names={cash:"💰 Savings",trust:"🤝 Trust",inv:"📈 Investors",life:"❤️ Life",months:"⏳ Months"};
  const deltas=Object.keys(before).map(k=>{
    const d=Math.round(S[k]-before[k]); if(!d) return "";
    if(k==="trust"&&sc.stage<4) return "";
    const good=k==="months"?d<0:d>0;
    return `<span class="delta ${good?"up":"down"}">${names[k]} ${d>0?"+":""}${k==="cash"?d+"K":d}</span>`;
  }).join("");
  const v={best:["✓ Great move","best"],ok:["~ Hmm, okay","ok"],bad:["✗ Ouch","bad"]}[c.tag];
  const allBest=sc.choices.every(x=>x.tag==="best");
  app.innerHTML=hud(sc.stage)+`
  <div class="card">
    ${stageArt(sc)}
    <div class="you-chose">You chose: ${c.t.replace(/<[^>]+>/g,"")}</div>
    ${sc.choices.length>1?`<span class="verdict ${v[1]}">${allBest?"✓ Solid choice. Every structure has trade-offs":v[0]}</span>`:""}
    <div class="story"><p>${val(c.res)}</p></div>
    <div class="deltas">${deltas}${tkGain?`<span class="delta up">📚 +${tkGain} takeaway${tkGain>1?"s":""}</span>`:""}</div>
    ${shown.map(tk).map(l=>`<div class="lesson"><div class="src">📚 ${l.src}${fresh_.has(l.key)?' <span class="new">NEW</span>':""}</div>${l.text}</div>`).join("")}
    <div class="next-row"><button class="btn" id="cont">Continue →</button></div>
  </div>
  <p class="hint">Press Enter to continue</p>`;
  Object.keys(before).forEach(k=>{ if(Math.round(S[k]-before[k])) app.querySelector(`.meter[data-k="${k}"]`)?.classList.add("flash"); });
  if(tkGain) app.querySelector('.meter[data-k="tk"]')?.classList.add("flash");
  document.getElementById("cont").onclick=()=>next(i+1);
  document.getElementById("cont").focus({preventScroll:true});
  window.scrollTo({top:0,behavior:"smooth"});
}

// ---------- Exit math ----------
function exitMath(){
  const price=S.mult*1000;                      // $K (SDE $1.0M)
  const equityIn=price*(1-S.debt);
  const debtIn=price*S.debt;
  const star=S.ops>=4&&S.goodProfile&&S.tail&&S.rec==="right"&&S.dd==="smart"&&S.debt===.7&&!S.lowball;
  let growth=clamp(1+.1*S.ops+(S.goodProfile?.05:0)+(S.tail?.1:0)-(S.dd==="none"?.15:0),.6,1.7);
  let exitMult=4.5+(S.rec==="right"?.5:0)+(S.ops>=3?.5:0)-(S.ops<0?.5:0);
  if(star){ growth=S.ops>=5?2.6:2.4; exitMult=S.ops>=5?7.5:7.0; }
  const exitEbitda=1000*growth;
  const ev=exitEbitda*exitMult;
  const remDebt=debtIn*(S.debt>=.9?.4:S.debt>0?.15:0);
  const bust=S.debt>=.9&&S.ops<=1;
  const equityOut=bust?0:Math.max(0,ev-remDebt);
  const pref=equityIn*Math.pow(1.1,7);
  const searcher=Math.max(0,(equityOut-pref)*S.own);
  const investorsOut=equityOut-searcher;
  const moic=equityIn>0?investorsOut/equityIn:0;
  const irr=moic>0?Math.pow(moic,1/7)-1:-1;
  return {star,price,equityIn,debtIn,growth,exitEbitda,exitMult,ev,remDebt,bust,equityOut,pref,searcher,investorsOut,moic,irr};
}
function ending(x){
  if(x.bust) return ["🪳","The Cockroach Always Wins","With 90% debt and shaky operations, one slow winter meant missed loan payments. The bank took the keys."];
  if(x.star) return ["🌟","Search Fund Superstar","You nailed it. A private equity firm buys Bugs B. Gone as a platform for a regional roll-up and pays a premium multiple. Your investors' returns land in the top tier of search funds, and Prof. Whitaker asks you to guest-lecture."];
  if(x.searcher>=3000) return ["👑","Pest Control Tycoon","Your investors are framing your quarterly letters. Gary sends a postcard from Tampa."];
  if(x.searcher>=1500) return ["🏆","Successful Searcher","A strong exit. Investors are happy, the team is thriving, and you're getting calls about your next deal."];
  if(x.searcher>=700) return ["👍","Respectable Exit","You made money and learned a ton. A few choices left value on the table."];
  return ["😬","Expensive Education","You owned a business and survived, but the math didn't work for you. At least the skills are yours forever."];
}

    </div>
  </div>
  <footer>Made by Emilia de Jounge · MGT 4455 Entrepreneurship Through Acquisition · Prof. Doug Villhard<br>Bugs B. Gone, Gary, and all numbers are fictional and simplified for learning.</footer>`;
  countUp(document.getElementById("payout"),payoutK);
  document.getElementById("again").onclick=()=>{S=fresh();next(0)};
  document.getElementById("home").onclick=titleScreen;
}
function countUp(el,target){
  const t0=performance.now(),dur=1200;
  const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=money(target*e);if(p<1)requestAnimationFrame(step)};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) el.textContent=money(target); else requestAnimationFrame(step);
}
function studyGuide(){
  return Object.keys(T).map(r=>{
    const got=T[r].filter((_,i)=>S.lessons.includes(`${r}.${i+1}`)).length;
    return `<details class="reading"${got<5?" open":""}><summary>${R[r]} <span class="lb-note">(${got}/5)</span></summary><ul class="tk">${T[r].map((t,i)=>{const has=S.lessons.includes(`${r}.${i+1}`);return `<li class="${has?"got":"miss"}"><span>${has?"✓":"○"}</span>${t}</li>`}).join("")}</ul></details>`;
  }).join("")+`<p class="lb-note">${S.lessons.length===ALL_KEYS.length?`You found all ${ALL_KEYS.length} takeaways! 🎉`:`You collected ${S.lessons.length} of ${ALL_KEYS.length} takeaways. Play again with different choices to find the other ${ALL_KEYS.length-S.lessons.length}.`}</p>`;
}
// ---------- Keyboard ----------
document.addEventListener("keydown",e=>{
  const go=document.getElementById("go");
  if(go && e.key==="Enter"){ e.preventDefault(); go.click(); return; }
  const cont=document.getElementById("cont");
  if(cont && e.key==="Enter"){ e.preventDefault(); cont.click(); return; }
  const n=parseInt(e.key,10);
  if(n){ const b=app.querySelector(`.choice[data-pos="${n-1}"]`); if(b) b.click(); }
});

titleScreen();
</script>
